    <!-- 00 MOI -->
    <button class="panel p-moi" data-chapter="moi" aria-label="Catherine Fourcade — à propos">
      <picture>
        <source srcset="img/portrait.webp" type="image/webp">
        <img src="img/portrait.jpg" alt="" width="1080" height="1440" decoding="async">
      </picture>
      <div class="label"><div class="num">00</div><div class="name">CATHERINE</div>
        <div class="sub">maintenance &amp; fiabilité</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-haut">
        <div class="d-inner">
          <div class="d-kicker">À propos</div>
          <h2 class="d-title">Catherine</h2>
          <div class="d-co">Maintenance · Fiabilité · PGM / MMP</div>
          <p class="d-body">Dix ans de maintenance industrielle, dans cinq matières qui n'ont
          en commun que d'être exigeantes : l'eau d'une centrale, le métal d'un atelier
          d'usinage, la fibre d'une machine à papier, le lait d'une fromagerie, l'acier d'une
          aciérie. Le métier, lui, ne change pas — préparer avant d'intervenir, structurer ce
          qui ne l'est pas, et faire tenir les arrêts.</p>
          <div class="d-facts">
            <span><b>Terrain</b>cinq industries</span>
            <span><b>Métier</b>planification · fiabilité</span>
            <span><b>Base</b>Québec</span>
          </div>
        </div>
          <ol class="chrono" aria-label="Parcours">
            <li><span class="c-act">2015 – 2018 · EDF</span><span class="c-det">Technicienne d'exploitation</span></li>
            <li><span class="c-act">2018 · Usinage St-Laurent</span><span class="c-det">Mécanicienne</span></li>
            <li><span class="c-act">2020 – 2022 · Cascades</span><span class="c-det">Planificatrice / Acheteuse</span></li>
            <li><span class="c-act">2022 – 2023 · Maison Riviera</span><span class="c-det">Planificatrice maintenance</span></li>
            <li><span class="c-act">2023 – 2026 · Rio Tinto</span><span class="c-det">Planificatrice long terme, superviseure</span></li>
            <li><span class="c-act">2026 · Kruger (mandat STI)</span><span class="c-det">Planificatrice maintenance</span></li>
          </ol>
        </div>
        <section class="creations">
          <h3>Mes créations</h3>
          <div class="grille">
            <article class="creation" data-url="index.html">
              <h4>Matières vivantes</h4>
              <p>ce site — HTML, canvas, WebGL</p>
            </article>
          </div>
        </section>
      </div>
      <span class="back" role="button" tabindex="-1">← Retour</span>
    </button>

    <!-- 01 EAU -->
    <button class="panel p-eau" data-chapter="eau" aria-label="Eau — hydroélectricité, EDF 2015">
      <div class="deep"></div>
      <canvas class="liquid-sim" aria-hidden="true"></canvas>
      <div class="glint"></div>
      <div class="dots eau-gerbe" aria-hidden="true">
        <div class="bubble" style="--size:8px;--x:18%;--dur:7s;--delay:0s"></div>
        <div class="bubble" style="--size:5px;--x:32%;--dur:9s;--delay:1.2s"></div>
        <div class="bubble" style="--size:10px;--x:48%;--dur:8s;--delay:2.5s"></div>
        <div class="bubble" style="--size:4px;--x:62%;--dur:6.5s;--delay:3.8s"></div>
        <div class="bubble" style="--size:7px;--x:75%;--dur:10s;--delay:.7s"></div>
        <div class="bubble" style="--size:6px;--x:85%;--dur:7.8s;--delay:4.2s"></div>
      </div>
      <div class="info" aria-hidden="true">
        <div class="yr">2015 – 2018<br>LE&nbsp;POUGET&nbsp;(FRANCE)</div><div class="co">EDF — Technicienne d'exploitation</div>
      </div>
      <div class="label"><div class="num">01</div><div class="name">EAU</div>
        <div class="sub">hydroélectricité</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-inner">
          <div class="d-kicker">Chapitre 01 · 2015 – 2018 · Le Pouget</div>
          <h2 class="d-title">Eau</h2>
          <div class="d-co">EDF — Technicienne d'exploitation, Division Production et Ingénierie Hydraulique</div>
          <p class="d-body">Trois ans au Groupement d'Usine du Pouget, sur des ouvrages
          hydrauliques qui ne s'arrêtent jamais vraiment : préparation et pilotage de la
          maintenance mécanique, surveillance des barrages du Pouget et du Truel. C'est là
          que naît le réflexe qui guide tout le reste — préparer d'abord, intervenir ensuite,
          et écrire ce qui doit l'être, du bon de travail à l'analyse de risque.</p>
          <div class="d-facts">
            <span><b>Périmètre</b>Groupement d'Usine</span>
            <span><b>Ouvrages</b>barrages du Pouget et du Truel</span>
            <span><b>Outil</b>GEM'Hydro</span>
          </div>
        </div>
          <ol class="chrono" aria-label="Déroulé du chapitre">
            <li class="c-tete"><span class="c-act">Maintenance mécanique hydraulique</span><span class="c-det"></span></li>
            <li><span class="c-act">Préparation des activités</span><span class="c-det">préventif et correctif, périmètre du Groupement d'Usine</span></li>
            <li><span class="c-act">Surveillance des barrages</span><span class="c-det">Le Pouget et Le Truel</span></li>
            <li><span class="c-act">Maintenance des ouvrages</span><span class="c-det">pilotage et réalisation</span></li>
            <li><span class="c-act">Coûts et délais</span><span class="c-det">optimisation des opérations</span></li>
            <li><span class="c-act">Coordination d'équipe</span><span class="c-det">procédures, directives techniques, délais</span></li>
            <li><span class="c-act">Dépannages</span><span class="c-det">organisation et mise en œuvre</span></li>
            <li class="c-tete"><span class="c-act">Préparation</span><span class="c-det"></span></li>
            <li><span class="c-act">Bons de travail</span><span class="c-det">création et structuration dans GEM'Hydro</span></li>
            <li><span class="c-act">Sous-traitance</span><span class="c-det">processus pris en charge selon les travaux</span></li>
            <li><span class="c-act">Sécurité du chantier</span><span class="c-det">normes, procédures et modes opératoires</span></li>
            <li><span class="c-act">Clôture des bons de travail</span><span class="c-det">vérification des données enregistrées</span></li>
            <li><span class="c-act">Modes opératoires</span><span class="c-det">rédaction détaillée</span></li>
            <li><span class="c-act">Analyses de risques</span><span class="c-det">Prévention Santé Sécurité — rédaction et amélioration</span></li>
          </ol>      </div>
      <span class="back" role="button" tabindex="-1">← Retour</span>
    </button>

    <!-- 02 COPEAUX -->
    <button class="panel p-cop" data-chapter="copeaux" aria-label="Copeaux — usinage, Usinage St-Laurent 2018">
      <div class="deep"></div><div class="glint"></div>
      <canvas class="cop-sim" aria-hidden="true"></canvas>
      <div class="info" aria-hidden="true">
        <div class="yr">2018 · SOREL-TRACY</div><div class="co">Usinage St-Laurent — Mécanicienne</div>
      </div>
      <div class="label"><div class="num">02</div><div class="name">COPEAUX</div>
        <div class="sub">usinage de précision</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-inner">
          <div class="d-kicker">Chapitre 02 · 2018 · 0,02 mm</div>
          <h2 class="d-title">Copeaux</h2>
          <div class="d-co">Usinage St-Laurent — Mécanicienne</div>
          <p class="d-body">La maintenance appliquée à l'usinage, les mains dans la machine :
          montages mécaniques, préventif et correctif au quotidien. Mise en place du 5S,
          réorganisation des postes de travail, implantation d'une gestion des stocks.
          La précision au centième — la base de tout ce qui suit.</p>
          <div class="d-facts">
            <span><b>Mécanique</b>montages + dépannage</span>
            <span><b>5S</b>postes réorganisés</span>
            <span><b>Stocks</b>système implanté</span>
          </div>
        </div>
          <ol class="chrono" aria-label="Déroulé du chapitre">
            <li><span class="c-act">Montages mécaniques et dépannage</span><span class="c-det"></span></li>
            <li><span class="c-act">Mise en place du 5S</span><span class="c-det"></span></li>
            <li><span class="c-act">Réorganisation des postes de travail</span><span class="c-det"></span></li>
            <li><span class="c-act">Implantation de la gestion des stocks</span><span class="c-det"></span></li>
          </ol>
      </div>
      <span class="back" role="button" tabindex="-1">← Retour</span>
    </button>

    <!-- 03 FIBRE -->
    <button class="panel p-fib" data-chapter="fibre" aria-label="Fibre — pâtes et papiers, Cascades 2020 et Kruger 2026">
      <div class="deep"></div><div class="glint"></div>
      <canvas class="fibre-mat" aria-hidden="true"></canvas>
      <div class="info" aria-hidden="true">
        <div class="yr">2020 – 2022 · DRUMMONDVILLE</div><div class="co">Cascades — Planificatrice / Acheteuse</div>
        <div class="yr">2026 · CRABTREE · MANDAT STI</div><div class="co">Kruger — Planificatrice maintenance</div>
      </div>
      <div class="label"><div class="num">03</div><div class="name">FIBRE<sup class="ast" aria-hidden="true">*</sup></div>
        <div class="sub">pâtes &amp; papiers</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-inner">
          <div class="d-kicker">Chapitre 03 · 2020 – 2022 et 2026</div>
          <h2 class="d-title">Fibre</h2>
          <div class="d-co">Cascades, Drummondville — Planificatrice / Acheteuse maintenance</div>
          <div class="d-co">Kruger — Planificatrice maintenance, mandat STI</div>
          <p class="d-body">Une machine à papier dicte son tempo : on planifie autour d'elle,
          jamais contre elle. Organisation des shutdowns, gestion des urgences,
          planification des travaux préventifs et correctifs, facturation.
          L'école de la débrouillardise structurée. Retour à la fibre en 2026, le temps
          d'un mandat de cinq mois chez Kruger pour le compte de STI Maintenance.</p>
          <div class="d-facts">
            <span><b>Shutdowns</b>organisation complète</span>
            <span><b>Achats</b>liés à la maintenance</span>
            <span><b>KPI</b>de réalisation</span>
            <span><b>Mandat</b>Kruger · via STI</span>
          </div>
          <p class="d-note">* Les signes qui s'inscrivent sous le curseur ne sont pas
          décoratifs : ils notent <i>nfr wrt</i> — « nefer weret », très parfait,
          en égyptien ancien.</p>
        </div>
          <ol class="chrono" aria-label="Déroulé du chapitre">
            <li class="c-tete"><span class="c-act">Cascades · 2020 – 2022</span><span class="c-det"></span></li>
            <li><span class="c-act">Planification des travaux</span><span class="c-det">correctif et préventif</span></li>
            <li><span class="c-act">Gestion des urgences</span><span class="c-det">au fil de la production</span></li>
            <li><span class="c-act">Achats</span><span class="c-det">tout ce qui touche à la maintenance</span></li>
            <li><span class="c-act">Gros arrêts</span><span class="c-det">organisation des shutdowns</span></li>
            <li><span class="c-act">KPI de réalisation</span><span class="c-det">mise en place et suivi</span></li>
            <li><span class="c-act">Factures en exception</span><span class="c-det">libération</span></li>
            <li class="c-tete"><span class="c-act">Kruger · mandat STI</span><span class="c-det"></span></li>
            <li><span class="c-act">Planificatrice maintenance</span><span class="c-det">mars à juillet 2026</span></li>
          </ol>      </div>
      <span class="back" role="button" tabindex="-1">← Retour</span>
    </button>

    <!-- 04 LAIT -->
    <button class="panel p-lait light" data-chapter="lait" aria-label="Lait — agroalimentaire, Maison Riviera 2022">
      <div class="deep"></div>
      <canvas class="lait-gl" aria-hidden="true"></canvas>
      <div class="glint"></div>
      <div class="info" aria-hidden="true">
        <div class="yr">2022 – 2023 · SOREL-TRACY</div><div class="co">Maison Riviera — Planificatrice maintenance</div>
      </div>
      <div class="label"><div class="num">04</div><div class="name">LAIT</div>
        <div class="sub">alimentaire</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-inner">
          <div class="d-kicker">Chapitre 04 · 2022 – 2023 · GMAO Interal</div>
          <h2 class="d-title">Lait</h2>
          <div class="d-co">Maison Riviera — Planificatrice maintenance</div>
          <p class="d-body">Fiabiliser sous SQF et ACIA : la maintenance au service de la
          salubrité. Tenue et optimisation du programme préventif, périodicité ajustée aux
          recommandations des fabricants et aux signaux du terrain, coordination des arrêts
          de ligne entre deux productions. Et un travail de fond dans la GMAO — normes
          d'identification des équipements, données, rapports — pour que la planification
          repose sur autre chose que la mémoire des uns et des autres.</p>
          <div class="d-facts">
            <span><b>GMAO</b>Interal</span>
            <span><b>Conformité</b>SQF · ACIA · BPF</span>
            <span><b>Préventif</b>programme et calendrier</span>
          </div>
        </div>
          <ol class="chrono" aria-label="Déroulé du chapitre">
            <li class="c-tete"><span class="c-act">Programme préventif</span><span class="c-det"></span></li>
            <li><span class="c-act">Programme de maintenance préventive</span><span class="c-det">tenue à jour et optimisation</span></li>
            <li><span class="c-act">Calendrier préventif</span><span class="c-det">développé en commun avec la laiterie Bel</span></li>
            <li><span class="c-act">Périodicité des entretiens</span><span class="c-det">recommandations fabricants, usages, signaux opérationnels</span></li>
            <li class="c-tete"><span class="c-act">GMAO — Interal</span><span class="c-det"></span></li>
            <li><span class="c-act">Informations et données</span><span class="c-det">tenues à jour</span></li>
            <li><span class="c-act">Bons de travail</span><span class="c-det">enregistrement assuré par l'équipe</span></li>
            <li><span class="c-act">Identification des équipements</span><span class="c-det">normes mises au point, implantées, diffusées</span></li>
            <li><span class="c-act">Planification et rapports</span><span class="c-det">outils informatiques mis à profit</span></li>
            <li class="c-tete"><span class="c-act">Coordination et conformité</span><span class="c-det"></span></li>
            <li><span class="c-act">Tâches par quart de travail</span><span class="c-det">coordination</span></li>
            <li><span class="c-act">Arrêts de ligne et d'équipement</span><span class="c-det">avec la production et la planification</span></li>
            <li><span class="c-act">Pièces et matériaux</span><span class="c-det">commandes avec le groupe d'achats</span></li>
            <li><span class="c-act">Sous-traitants et appels de service</span><span class="c-det">suivi et planification</span></li>
            <li><span class="c-act">Inventaires du magasin</span><span class="c-det">gestion</span></li>
            <li><span class="c-act">SST et BPF</span><span class="c-det">politiques et procédures appliquées</span></li>
            <li><span class="c-act">KPI</span><span class="c-det">mise en place</span></li>
          </ol>      </div>
      <span class="back" role="button" tabindex="-1">← Retour</span>
    </button>

    <!-- 05 ACIER -->
    <button class="panel p-aci" data-chapter="acier" aria-label="Acier — aciérie, Rio Tinto 2023">
      <div class="deep"></div><div class="glint"></div>
      <div class="heat" aria-hidden="true"></div>
      <div class="pour" aria-hidden="true"></div>
      <div class="bath" aria-hidden="true"></div>
      <div class="impact" aria-hidden="true"></div>
      <canvas class="lava-gl" aria-hidden="true"></canvas>
      <div class="dots gerbe" aria-hidden="true">
        <div class="ember" style="--size:5px;--x:22%;--sway:14px;--dur:5s;--delay:0s"></div>
        <div class="ember" style="--size:3px;--x:35%;--sway:-10px;--dur:6.5s;--delay:1.1s"></div>
        <div class="ember" style="--size:6px;--x:50%;--sway:18px;--dur:5.5s;--delay:2.3s"></div>
        <div class="ember" style="--size:4px;--x:64%;--sway:-16px;--dur:7s;--delay:.6s"></div>
        <div class="ember" style="--size:5px;--x:76%;--sway:12px;--dur:6s;--delay:3.4s"></div>
        <div class="ember" style="--size:4px;--x:12%;--sway:10px;--dur:6.8s;--delay:5.2s"></div>
      </div>
      <div class="info" aria-hidden="true">
        <div class="yr">2023 – 2026 · SOREL-TRACY</div><div class="co">Rio Tinto — Planificatrice long terme</div>
      </div>
      <div class="label"><div class="num">05</div><div class="name">ACIER</div>
        <div class="sub">aciérie</div></div>
      <div class="detail" aria-hidden="true">
        <div class="d-inner">
          <div class="d-kicker">Chapitre 05 · 2023 – 2026 · Sorel-Tracy</div>
          <h2 class="d-title">Acier</h2>
          <div class="d-co">Rio Tinto — Planificatrice long terme et superviseure, Aciérie</div>
          <p class="d-body">Trois ans à préparer l'arrêt annuel d'une aciérie : achats,
          réservations de services, budget, mise à jour du préventif. Et une interface de
          gestion d'arrêt bâtie sous Excel et SAP, parce qu'aucun outil existant ne tenait
          la charge. Puis le terrain — suivi des travaux, supervision des équipes externes,
          règles de sécurité. Quand la coulée reprend, tout doit tenir.</p>
          <div class="d-facts">
            <span><b>Arrêt annuel</b>planification complète</span>
            <span><b>Budget</b>gestion et suivi</span>
            <span><b>Outils</b>interface Excel / SAP</span>
            <span><b>Terrain</b>chantier et équipes externes</span>
          </div>
        </div>
          <ol class="chrono" aria-label="Déroulé du chapitre">
            <li><span class="c-act">Arrêt annuel</span><span class="c-det">planification complète</span></li>
            <li><span class="c-act">Achats et réservations</span><span class="c-det">matériel et services</span></li>
            <li><span class="c-act">Budget</span><span class="c-det">gestion et suivi</span></li>
            <li><span class="c-act">Maintenance préventive</span><span class="c-det">mise à jour</span></li>
            <li><span class="c-act">KPI</span><span class="c-det">mise en place</span></li>
            <li><span class="c-act">Interface de gestion d'arrêt</span><span class="c-det">créée sous Excel et SAP</span></li>
            <li><span class="c-act">Travaux sur chantier</span><span class="c-det">suivi</span></li>
            <li><span class="c-act">Équipes externes</span><span class="c-det">supervision</span></li>
            <li><span class="c-act">Règles SST</span><span class="c-det">application</span></li>
          </ol>      </div>
